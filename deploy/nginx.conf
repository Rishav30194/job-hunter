# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name jobhunter.mooo.com;
    return 301 https://$host$request_uri;
}

# HTTPS reverse proxy → Streamlit dashboard
server {
    listen 443 ssl;
    server_name jobhunter.mooo.com;

    ssl_certificate     /etc/letsencrypt/live/jobhunter.mooo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jobhunter.mooo.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Password protection — run: sudo htpasswd -c /etc/nginx/.htpasswd <username>
    auth_basic           "Job Hunter";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        proxy_pass         http://127.0.0.1:8501;
        proxy_http_version 1.1;

        # WebSocket support — required for Streamlit live updates
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep Streamlit connections alive
        proxy_read_timeout 86400;
    }
}
